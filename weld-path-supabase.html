<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BGTTC Welding – Welding Learner</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --steel:#E3E6E8; --panel:#F4F5F6; --ink:#16232D; --muted:#5B6B77; --line:#C5CBD0;
  --arc:#2D6BFF; --flame:#E4570F; --straw:#D9A93B; --good:#1F8A4C; --bad:#C23030; --lock:#9AA5AD;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--steel:#161D23;--panel:#1F2830;--ink:#E8ECEF;--muted:#9BA9B4;--line:#33414B;--lock:#55646F}
}
*{box-sizing:border-box}
body{margin:0;background:var(--steel);color:var(--ink);font-family:'Barlow','Hind Siliguri',system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh}
h1,h2,h3{font-family:'Barlow Condensed','Hind Siliguri',sans-serif;font-weight:700;margin:0;line-height:1.1}
h1{font-size:2.4rem}h2{font-size:1.7rem}h3{font-size:1.25rem}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--arc);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--panel);border-bottom:3px solid var(--ink);flex-wrap:wrap}
.brand{font-family:'Barlow Condensed';font-weight:700;font-size:1.4rem;display:flex;align-items:center;gap:8px;cursor:pointer}
.spark{width:14px;height:14px;background:var(--flame);transform:rotate(45deg);display:inline-block}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:transparent;border:2px solid var(--ink);padding:6px 12px;border-radius:6px;font-weight:600}
.btn{background:var(--flame);color:#fff;padding:13px 18px;border-radius:8px;font-weight:600;font-size:1.02rem;width:100%}
.btn.alt{background:var(--ink);color:var(--steel)}
.btn.sm{width:auto;padding:8px 14px;font-size:.92rem}
.btn.bad{background:var(--bad)}
.btn:disabled{background:var(--lock);cursor:not-allowed}
.card{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:18px;margin-bottom:12px}
.muted{color:var(--muted)}
.pill{display:inline-block;background:var(--ink);color:var(--steel);border-radius:20px;padding:2px 10px;font-size:.8rem;font-weight:600}
.login{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:760px){.login{grid-template-columns:1.1fr 1fr}}
.hero{background:var(--ink);color:#EDEFF1;border-radius:10px;padding:28px;position:relative;overflow:hidden;min-height:240px;display:flex;flex-direction:column;justify-content:flex-end}
.temper{position:absolute;left:0;right:0;top:0;height:12px;background:linear-gradient(90deg,#E8D9A0,#D9A93B,#C8742B,#8A4A9E,#3C57C8,#2D6BFF)}
.hero p{margin:10px 0 0;color:#B9C3CA;max-width:34ch}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-weight:600;margin-bottom:4px}
input,textarea,select{width:100%;padding:11px;border:2px solid var(--ink);border-radius:8px;background:var(--steel);color:var(--ink);font:inherit}
.err{color:var(--bad);min-height:1.2em;margin:0 0 10px;font-size:.92rem}
.link{background:none;color:var(--arc);text-decoration:underline;padding:6px 0;font-weight:600}
.dhero{background:var(--ink);color:#EDEFF1;border-radius:12px;padding:22px 18px 16px;position:relative;overflow:hidden;margin-bottom:14px}
.dtop{display:flex;align-items:center;gap:14px;margin-top:4px}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#E8D9A0,#D9A93B 50%,#C8742B);color:#16232D;display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:1.5rem;flex:none;border:3px solid #EDEFF1}
.dtop h2{color:#fff}
.rank{display:inline-block;margin-top:4px;background:rgba(255,255,255,.14);padding:2px 10px;border-radius:20px;font-size:.85rem;font-weight:600}
.xpbar{height:10px;background:rgba(255,255,255,.18);border-radius:5px;margin:14px 0 6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#E8D9A0,#D9A93B,#C8742B,#8A4A9E,#3C57C8,#2D6BFF)}
.xpmeta{display:flex;justify-content:space-between;font-size:.85rem;color:#B9C3CA}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:'Barlow Condensed';font-size:1.8rem;line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.banner{background:linear-gradient(135deg,var(--flame),#C8742B);color:#fff;border-radius:10px;padding:16px;border:2px solid var(--ink);margin-bottom:14px}
.banner p{margin:4px 0 12px}
.banner .btn{background:#fff;color:var(--ink)}
.sec{margin:20px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.path{position:relative;padding-left:46px}
.path:before{content:"";position:absolute;left:19px;top:18px;bottom:18px;width:8px;border-radius:4px;background:repeating-linear-gradient(180deg,var(--ink) 0 10px,var(--line) 10px 16px)}
.lvl{position:relative;display:block;width:100%;text-align:left;background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.lvl .node{position:absolute;left:-46px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--flame);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:1.2rem}
.lvl.locked{background:transparent;border-style:dashed;border-color:var(--lock);color:var(--lock)}
.lvl.locked .node{background:var(--steel);border-color:var(--lock);color:var(--lock)}
.lvl .t{font-family:'Barlow Condensed';font-weight:700;font-size:1.35rem}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--steel);border:1px solid var(--line)}
.chip.ok{background:var(--good);color:#fff;border-color:var(--good)}
.back{background:none;font-weight:600;padding:6px 0;margin-bottom:8px;color:var(--muted)}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:700px){.hub{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:16px 14px;text-align:left;min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
.tile:hover{background:var(--ink);color:var(--steel)}
.tile .ic{font-size:1.8rem}
.tile .t{font-family:'Barlow Condensed';font-weight:700;font-size:1.45rem}
.tile .s{font-size:.85rem;opacity:.75}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;gap:8px}
.timer{font-family:'Barlow Condensed';font-size:1.6rem;background:var(--ink);color:var(--steel);padding:2px 12px;border-radius:6px}
.timer.low{background:var(--bad);color:#fff}
.qtext{font-size:1.18rem;font-weight:600;margin:6px 0 16px;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;background:var(--steel);border:2px solid var(--ink);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--arc)}
.opt.ok{background:var(--good);color:#fff;border-color:var(--good)}
.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.sel{border-color:var(--arc);box-shadow:inset 0 0 0 2px var(--arc)}
.note{background:var(--steel);border-left:6px solid var(--straw);padding:10px 12px;border-radius:4px;margin:10px 0 14px;white-space:pre-wrap}
.toolimg{background:#fff;border:2px solid var(--ink);border-radius:10px;display:grid;place-items:center;padding:10px;margin-bottom:14px;min-height:140px}
.toolimg img{max-width:100%;max-height:260px;object-fit:contain}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{padding:8px 14px;border:2px solid var(--ink);border-radius:20px;background:transparent;font-weight:600}
.tabs button.on{background:var(--ink);color:var(--steel)}
.cqi{background:var(--panel);border:2px solid var(--ink);border-radius:8px;margin-bottom:8px;padding:10px 12px}
.cqi summary{cursor:pointer;font-weight:600}
.cqi[open]{border-color:var(--arc)}
.cqi .note{margin:10px 0 0}
.lb{width:100%;border-collapse:collapse}
.lb td,.lb th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.lb tr.me{background:rgba(228,87,15,.14);font-weight:700}
.lb .pos{font-family:'Barlow Condensed';font-size:1.3rem;width:56px}
.lb .pt{text-align:right;font-family:'Barlow Condensed';font-size:1.3rem}
.scroll{overflow-x:auto;border:2px solid var(--ink);border-radius:10px;background:var(--panel)}
.scroll table{min-width:720px;width:100%;border-collapse:collapse;font-size:.92rem}
.scroll th,.scroll td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.big{font-family:'Barlow Condensed';font-size:4.5rem;font-weight:700;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--steel);padding:10px 16px;border-radius:8px;z-index:9;max-width:90%;text-align:center}
.stg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 14px}
@media(min-width:700px){.stg{grid-template-columns:repeat(10,1fr)}}
.sg{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;border:2px solid var(--ink);border-radius:10px;background:var(--panel);padding:4px;line-height:1.15}
.sg b{font-family:'Barlow Condensed';font-size:1.3rem}
.sg small{font-size:.72rem;font-weight:600}
.sg.passed{background:var(--good);color:#fff;border-color:var(--good)}
.sg.open{background:var(--flame);color:#fff}
.sg.locked{background:transparent;border-style:dashed;border-color:var(--lock);color:var(--lock)}
.sg.empty{background:transparent;border-style:dotted;border-color:var(--line);color:var(--line)}
button.sg{cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
.item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.item .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.thumb{width:56px;height:56px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;flex:none}

/* ===== v2 design refresh (Wayground-style, 2026-10-20) ===== */
:root{--vio:#6C4CF1;--vio2:#2D6BFF}
@media (prefers-color-scheme:light){
  body{background:linear-gradient(180deg,#ECE9FB 0,#E3E6E8 260px)}
}
.bar{position:sticky;top:0;z-index:6;box-shadow:0 2px 12px rgba(22,35,45,.10)}
.btn{background:linear-gradient(135deg,var(--vio),var(--vio2));border-radius:12px;box-shadow:0 4px 14px rgba(108,76,241,.30)}
.btn.alt{background:var(--ink);box-shadow:none}
.btn.bad{background:var(--bad);box-shadow:none}
.ghost{border-radius:10px}
.ghost:hover{border-color:var(--vio);color:var(--vio)}
.card,.stat,.cqi{border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(22,35,45,.07)}
.hero,.dhero{border-radius:16px;box-shadow:0 8px 24px rgba(22,35,45,.22)}
.lvl{border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(22,35,45,.07)}
.lvl .node{background:linear-gradient(135deg,var(--vio),var(--vio2));border-color:#fff;box-shadow:0 3px 10px rgba(108,76,241,.4)}
.lvl.locked{border:1.5px dashed var(--lock);box-shadow:none}
.tile{border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(22,35,45,.07);border-top:6px solid var(--vio)}
.hub .tile:nth-child(6n+2){border-top-color:var(--flame)}
.hub .tile:nth-child(6n+3){border-top-color:var(--straw)}
.hub .tile:nth-child(6n+4){border-top-color:#8A4A9E}
.hub .tile:nth-child(6n+5){border-top-color:var(--good)}
.hub .tile:nth-child(6n+6){border-top-color:var(--vio2)}
.hub .tile:nth-child(6n+7){border-top-color:#C8742B}
.tile:hover{background:linear-gradient(135deg,var(--vio),var(--vio2));color:#fff;border-color:transparent}
input,textarea,select{border:1.5px solid var(--line);border-radius:10px}
input:focus,textarea:focus,select:focus{border-color:var(--vio);outline:none;box-shadow:0 0 0 3px rgba(108,76,241,.22)}
.opt{border:1.5px solid var(--line);border-radius:12px}
.opt:hover:not(:disabled){border-color:var(--vio)}
.opt.sel{border-color:var(--vio);box-shadow:inset 0 0 0 2px var(--vio)}
.sg{border:1.5px solid var(--line);border-radius:12px}
.sg.open{background:linear-gradient(135deg,var(--vio),var(--vio2));border-color:transparent}
.tabs button{border:1.5px solid var(--line)}
.tabs button.on{background:linear-gradient(135deg,var(--vio),var(--vio2));color:#fff;border-color:transparent}
.scroll{border:1px solid var(--line);border-radius:14px}
.pill{background:linear-gradient(135deg,var(--vio),var(--vio2));color:#fff}
.link{color:var(--vio)}
/* flashcards */
.fcard{perspective:1200px;margin-bottom:12px}
.finner{position:relative;min-height:250px;transition:transform .45s;transform-style:preserve-3d}
.fcard.flip .finner{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 16px rgba(22,35,45,.10);padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto}
.fface.back{transform:rotateY(180deg);background:linear-gradient(160deg,#F1EDFF,var(--panel))}
.fq{font-size:1.25rem;font-weight:600;white-space:pre-wrap}
.fa{font-size:1.15rem;font-weight:600;color:var(--good);white-space:pre-wrap}
.bigcode{font-family:'Barlow Condensed';font-size:2.6rem;font-weight:700;letter-spacing:.12em;text-align:center;padding:10px;border:2px dashed var(--vio);border-radius:12px;color:var(--vio)}

/* ===== v3 left sidebar (Ashik's marked screenshot, 2026-10-20) ===== */
.layout{display:flex;align-items:flex-start;max-width:1240px;margin:0 auto}
.layout .wrap{flex:1;min-width:0}
.side{position:sticky;top:76px;width:236px;flex:none;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.suser{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sname{font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smut{font-size:.8rem;color:var(--muted)}
.sb{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:11px;background:transparent;font-weight:600;text-align:left;font-size:1rem;color:inherit}
.sb .sic{font-size:1.15rem;width:24px;text-align:center;flex:none}
.sb:hover{background:rgba(108,76,241,.10)}
.sb.on{background:linear-gradient(135deg,var(--vio),var(--vio2));color:#fff;box-shadow:0 4px 12px rgba(108,76,241,.30)}
@media(max-width:860px){
  .layout{flex-direction:column}
  .side{position:static;width:100%;flex-direction:row;overflow-x:auto;padding:10px 12px;gap:6px;border-bottom:1px solid var(--line)}
  .suser{display:none}
  .sb{width:auto;white-space:nowrap;padding:9px 12px}
}

/* ===== v5 level locks ===== */
.lvl.locked{opacity:.78;background:#F5F6F8}
</style>
</head>

const $=s=>document.querySelector(s);

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ME=null, LEVELS=[], ctx={level:1}, timerId=null;

async function rpc(name,args){const {data,error}=await sb.rpc(name,args||{});if(error)throw error;return data}

function shuf(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}

function shell(inner,back){

  const sitem=(v,ic,label)=>`<button class="sb ${VIEW===v?'on':''}" data-sb="${v}"><span class="sic">${ic}</span>${label}</button>`;

function loading(t){shell(`<div class="card"><b>${t||'Loading…'}</b></div>`)}

/* ============ AUTH ============ */
function authScreen(mode='login'){
  const su=mode==='signup';
  shell(`<div class="login">
   <section class="hero"><div class="temper"></div><h1>Learn welding,<br>one bead at a time.</h1><p>MCQ, written questions and tool recognition. Earn points, climb the leaderboard.</p></section>
   <section class="card"><h2>${su?'Create account':'Sign in'}</h2><p class="muted" style="margin:6px 0 14px">${su?'নাম, মোবাইল নাম্বার ও ইমেইল দিয়ে অ্যাকাউন্ট খুলুন':'ইমেইল ও পাসওয়ার্ড দিয়ে প্রবেশ করুন'}</p>
   ${su?`<label class="field"><span>Full name</span><input id="nm" autocomplete="name"></label><label class="field"><span>Mobile number</span><input id="ph" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01XXXXXXXXX"></label>`:''}
   <label class="field"><span>Email</span><input id="em" type="email" autocomplete="email"></label>
   <label class="field"><span>Password</span><input id="pw" type="password" autocomplete="${su?'new-password':'current-password'}" placeholder="${su?'At least 6 characters':''}"></label>
   <div class="err" id="er"></div>
   <button class="btn" id="go">${su?'Create account':'Sign in'}</button>
   <button class="link" id="sw">${su?'Already have an account? Sign in':'New here? Create an account'}</button></section></div>`);
  $('#sw').onclick=()=>authScreen(su?'login':'signup');
  const cs=document.createElement('p');cs.className='muted';cs.style.cssText='margin:10px 0 0;font-size:.88rem';cs.textContent='Checking connection…';$('#sw').after(cs);
  fetch(SB_URL+'/auth/v1/health',{headers:{apikey:SB_KEY}}).then(r=>{cs.textContent=r.ok?'✓ Connected to the server':'⚠ Server answered with status '+r.status}).catch(()=>{cs.style.color='var(--bad)';cs.textContent='✗ Cannot reach the server. Open this page in Chrome/Safari (not inside a preview) with internet on, or host it online.'});
  $('#go').onclick=async()=>{
    const em=$('#em').value.trim(),pw=$('#pw').value,er=$('#er');er.textContent='';
    if(!/^\S+@\S+\.\S+$/.test(em))return er.textContent='Enter a valid email address.';
    if(pw.length<6)return er.textContent='Password must be at least 6 characters.';
    $('#go').disabled=true;
    try{
      if(su){
        const nm=$('#nm').value.trim(),ph=$('#ph').value.trim();
        if(nm.length<2){er.textContent='Enter your full name.';$('#go').disabled=false;return}
        if(!/^\+?\d{10,14}$/.test(ph)){er.textContent='Enter a valid mobile number (10–14 digits).';$('#go').disabled=false;return}
        const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:nm,phone:ph}}});
        if(error)throw error;
        if(!data.session){authScreen('login');toast('Account created. Check your email to confirm, then sign in.');return}
      }else{
        const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error;
      }
      await boot();
    }catch(e){er.textContent=errMsg(e);$('#go').disabled=false}
  };
}
async function loadMe(){
  const {data:{user}}=await sb.auth.getUser();if(!user)return null;
  const {data,error}=await sb.from('profiles').select('id,full_name,email,phone,role').eq('id',user.id).single();

async function boot(){
  loading();

/* ============ DASHBOARD ============ */
const RANKS=[[0,'Apprentice'],[50,'Welder'],[200,'Fabricator'],[500,'Master welder']];
async function dash(){
  VIEW='dash';loading();
  await guard(async()=>{
    const lv=await rpc('get_dashboard');
    lv.forEach(l=>{const p=lv.find(x=>x.level_number===l.level_number-1);l._open=!!(l.is_unlocked&&(l.level_number===1||(p&&p.mcq_passed&&p.cq_passed)))});
    const cur=Math.max(1,...lv.filter(l=>l._open).map(l=>l.level_number));
    ctx.level=cur;
    const pr=await rpc('my_progress',{p_level:cur});
    let stagePts=0;
    try{for(const n of [1,2,3,4]){const sm=await rpc('stage_map',{p_level:n});((sm&&sm.stages)||[]).forEach(s=>{if(s.count>0)stagePts+=(s.best||0)})}}catch(e){}
    const myPts=pr.points+stagePts;
    const studied=pr.studied.mcq+pr.studied.cq+pr.studied.tool;
    let ri=0;RANKS.forEach((r,i)=>{if(myPts>=r[0])ri=i});
    const nx=RANKS[ri+1];const pct=nx?Math.round((myPts-RANKS[ri][0])*100/(nx[0]-RANKS[ri][0])):100;
    const ini=(ME.full_name||ME.email||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const levels=lv.map(l=>{
      const open=l._open,isCur=l.level_number===cur;
      const done=l.mcq_passed&&l.cq_passed;
      return `<button class="lvl ${open?'':'locked'}" data-n="${l.level_number}"><span class="node">${open?l.level_number:'🔒'}</span>
        <div class="t">${LEVEL_ICON[l.level_number-1]||''} Level ${l.level_number} · ${esc(l.title.replace(/^Level \d+:\s*/,''))}</div>
        <div class="muted" style="font-size:.92rem">${open?(done?'Cleared. Open to review.':(isCur?'Current level. Finish all the stages, then pass the final exam (80+) to open the next level.':'Open')):'🔒 Locked — আগের লেভেল শেষ করলে খুলবে।'}</div>
        ${open?`<div class="chips"><span class="chip ${l.mcq_passed?'ok':''}">MCQ best ${l.mcq_best_score==null?'–':Math.round(l.mcq_best_score)+'%'}</span><span class="chip ${l.cq_passed?'ok':''}">CQ best ${l.cq_best_score==null?'–':Math.round(l.cq_best_score)+'%'}</span></div>`:''}</button>`}).join('');
    shell(`<section class="dhero"><div class="temper"></div>
      <div class="dtop"><div class="avatar">${esc(ini)}</div><div style="flex:1;min-width:0"><h2>Hello, ${esc((ME.full_name||'learner').split(' ')[0])}</h2><span class="rank">${RANKS[ri][1]}</span></div></div>
      <div class="xpbar"><i style="width:${pct}%"></i></div>
      <div class="xpmeta"><span>${myPts} points</span><span>${nx?(nx[0]-myPts)+' to '+nx[1]:'Top rank reached'}</span></div></section>
     <div class="stats">
      <div class="stat"><b>${myPts}</b><span>Points</span></div>
      <div class="stat"><b>#${pr.rank}</b><span>Leaderboard rank</span></div>
      <div class="stat"><b>${studied}</b><span>Studied in Level ${cur}</span></div>
      <div class="stat"><b>Level ${cur}</b><span>Current level</span></div></div>
     ${pr.practice_due?`<div class="banner"><h3>Practice exam ready</h3><p>You finished another 50 MCQs. This exam gives no points.</p><button class="btn" id="pe">Start practice exam</button></div>`:''}
     <div class="card"><h3>🎟️ Join a class with a code</h3><p class="muted" style="margin:4px 0 10px">Your teacher gives you a class code. Put it here to join the class list.</p><div class="row"><input id="jcode" placeholder="e.g. WELD-4821" style="text-transform:uppercase" autocomplete="off"><button class="btn sm" id="jgo" style="flex:none">Join</button></div><p class="muted" id="jmsg" style="margin:8px 0 0"></p></div>
     <div class="sec"><h2>Your path</h2></div><div class="path">${levels}</div>`);
    const jgo=$('#jgo');if(jgo)jgo.onclick=()=>guard(async()=>{
      const code=($('#jcode').value||'').trim().toUpperCase(),m=$('#jmsg');
      if(!code){m.textContent='Write the code first.';return}
      jgo.disabled=true;
      try{
        const r=await rpc('redeem_join_code',{p_code:code});
        if(r&&r.status==='joined')m.innerHTML='✅ Joined <b>'+esc(r.label||'class')+'</b> (Level '+r.level_number+'). Your teacher can now see you in the class list.';
        else if(r&&r.status==='already')m.textContent='You already joined this class.';
        else if(r&&r.status==='expired')m.textContent='This code has expired. Ask your teacher for a new one.';
        else m.textContent='Code not found. Check the letters and try again.';
      }catch(e){
        m.textContent='Join codes are not switched on yet. Your teacher needs to run one small setup file first.';
      }finally{jgo.disabled=false}
    });
    if($('#pe'))$('#pe').onclick=()=>startExam('mcq',true);
    document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{const n=+b.dataset.n,l=lv.find(x=>x.level_number===n);if(!l._open)return toast('🔒 Locked — আগের লেভেল শেষ করলে খুলবে');hub(n)});
  },authScreen);
}

     ${pr.practice_due?`<div class="banner"><h3>Practice exam ready</h3><p>You finished 50 more MCQs. Take the practice exam. No points.</p><button class="btn" id="pe">Start practice exam</button></div>`:''}
     <div class="hub">
      ${t('hm','📝','MCQ','100 stages · 10 MCQs each')}

const LABEL={mcq:'MCQ',cq:'CQ',tool:'Tools'};

/* ============ STUDY (one at a time; answer revealed after you answer) ============ */
async function study(kind){
  loading();
  await guard(async()=>{
    const d=await rpc('study_next',{p_kind:kind,p_level:ctx.level});
    const back={label:'Level '+ctx.level,fn:()=>hub(ctx.level)};
    if(kind==='mcq'&&d.studied>0&&d.studied%50===0&&ctx.promptedAt!==d.studied){
      ctx.promptedAt=d.studied;
      shell(`<div class="card"><h2>50 MCQs done</h2><p class="muted">Take the practice exam on the last 50 you studied. It gives no points.</p><div class="row"><button class="btn alt" id="kp">Keep studying</button><button class="btn" id="sp">Start practice exam</button></div></div>`,back);
      $('#kp').onclick=()=>study('mcq');$('#sp').onclick=()=>startExam('mcq',true);return;
    }
    if(!d.item){
      shell(`<div class="card"><h2>All ${LABEL[kind]} studied</h2><p class="muted">${d.studied?'You have studied every '+LABEL[kind]+' item in this level.':'No '+LABEL[kind]+' items have been added to this level yet.'}</p><div class="row"><button class="btn alt" id="h">Read again</button><button class="btn" id="e">Take exam</button></div></div>`,back);
      $('#h').onclick=()=>historyView(kind,0);$('#e').onclick=examMenu;return;
    }
    const it=d.item,head=`<div class="qhead"><span>${LABEL[kind]} · ${d.studied+1} of ${d.studied+d.remaining}</span><span class="pill">Level ${ctx.level}</span></div>`;
    if(kind==='cq'){
      shell(`${head}<div class="card"><div class="qtext">${esc(it.question)}</div><div id="ans"></div><button class="btn alt" id="rv" style="margin-bottom:10px">Show model answer</button><button class="btn" id="nx" disabled>Next</button></div>`,back);
      $('#rv').onclick=()=>guard(async()=>{const r=await rpc('study_answer',{p_kind:'cq',p_id:it.id});$('#ans').innerHTML=`<div class="note">${esc(r.answer)}</div>`;$('#rv').remove();$('#nx').disabled=false});
    }else{
      const L='ABCD';
      const opts=shuf(it.options.map((t,k)=>({t,k}))).map((o,j)=>`<button class="opt" data-k="${kind==='mcq'?L[o.k]:esc(o.t)}">${kind==='mcq'?L[j]+'. ':''}${esc(o.t)}</button>`).join('');
      shell(`${head}<div class="card">${kind==='tool'?`<div class="toolimg"><img src="${esc(imgUrl(it.image_path))}" alt="Tool to identify"></div><div class="qtext">What is the correct name of this tool?</div>`:`<div class="qtext">${esc(it.question)}</div>`}${opts}<div id="ex"></div><button class="btn" id="nx" disabled>Next</button></div>`,back);
      document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>guard(async()=>{
        document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        const choice=b.dataset.k;
        const r=await rpc('study_answer',{p_kind:kind,p_id:it.id,p_choice:choice});
        document.querySelectorAll('.opt').forEach(x=>{
          const isCorrect=kind==='mcq'?x.dataset.k===r.correct_option:x.dataset.k===r.correct_answer;
          if(isCorrect)x.classList.add('ok');else if(x===b)x.classList.add('no');
        });
        $('#ex').innerHTML=`<div class="note">${r.correct?'Correct. ':'Not quite. '}${kind==='tool'?'This is: '+esc(r.correct_answer)+'.':esc(r.explanation||'')}</div>`;
        $('#nx').disabled=false;
      }));
    }
    $('#nx').onclick=()=>study(kind);
  },()=>hub(ctx.level));
}

/* ============ MCQ STAGES (100 stages, 10 fixed MCQs each) ============ */
async function mcqStages(){
  loading();
  await guard(async()=>{
    const d=await rpc('stage_map',{p_level:ctx.level});
    const st=d.stages;ctx.stageMap=st;
    const passed=st.filter(x=>x.status==='passed').length,avail=st.filter(x=>x.count>0).length;
    const sub=x=>x.status==='passed'?'✓ '+x.best+'/'+x.count:x.status==='locked'?'🔒':x.status==='empty'?'soon':'open';
    shell(`<h2>MCQ stages</h2><p class="muted" style="margin:4px 0 12px">Every stage has 10 MCQs. The questions and the A B C D options shuffle every time you play, so answer positions cannot be memorised. Score 8 of 10 or more to open the next stage. You can read cleared stages again any time.</p>
      <div class="stats"><div class="stat"><b>${passed}/${avail}</b><span>Stages cleared</span></div><div class="stat"><b>${d.open_stage<=100?d.open_stage:'–'}</b><span>Next stage to play</span></div></div>
      <div class="stg">${st.map(x=>`<button class="sg ${x.status}" data-s="${x.stage}" aria-label="Stage ${x.stage} ${x.status}"><b>${x.stage}</b><small>${sub(x)}</small></button>`).join('')}</div>`,{label:'Level '+ctx.level,fn:()=>hub(ctx.level)});
    document.querySelectorAll('.sg[data-s]').forEach(b=>b.onclick=()=>{
      const x=st.find(y=>y.stage===+b.dataset.s);
      if(x.status==='locked')return toast('Locked. Clear Stage '+(x.stage-1)+' first.');
      if(x.status==='empty')return toast(x.stage>d.open_stage?'Locked.':'No questions in this stage yet.');
      stageHome(x);
    });
  },()=>hub(ctx.level));
}
function stageHome(x){
  const need=Math.ceil(x.count*0.8);
  shell(`<div class="card"><h2>Stage ${x.stage}</h2><p class="muted" style="margin:6px 0 14px">${x.count} MCQs · pass with ${need} correct${x.attempts?` · best ${x.best}/${x.count} · ${x.attempts} attempt${x.attempts>1?'s':''}`:''}</p>
    <button class="btn" id="go" style="margin-bottom:10px">${x.status==='passed'?'Play again':'Start stage'}</button>
    ${x.attempts?'<button class="btn alt" id="rd">Read this stage again</button>':''}</div>`,{label:'All stages',fn:mcqStages});
  $('#go').onclick=()=>runStage(x.stage);
  if($('#rd'))$('#rd').onclick=()=>stageReview(x.stage);
}
async function runStage(stage){
  loading('Opening stage…');
  await guard(async()=>{
    const d=await rpc('stage_start',{p_level:ctx.level,p_stage:stage});
    const qs=shuf(d.questions).map(q=>({id:q.id,question:q.question,opts:shuf(q.options.map((t,k)=>({t,k})))}));
    ctx.stg={id:d.attempt_id,stage:d.stage,qs,need:d.need,i:0,correct:0};
    stageQ();
  },mcqStages);
}
function stageQ(){
  const S=ctx.stg,q=S.qs[S.i],L='ABCD',last=S.i+1===S.qs.length;
  shell(`<div class="qhead"><span>Stage ${S.stage} · Question ${S.i+1} of ${S.qs.length}</span><span class="pill">${S.correct} correct</span></div>
    <div class="card"><div class="qtext">${esc(q.question)}</div>${q.opts.map((o,j)=>`<button class="opt" data-k="${L[o.k]}">${L[j]}. ${esc(o.t)}</button>`).join('')}<div id="ex"></div><button class="btn" id="nx" disabled>${last?'Finish stage':'Next'}</button></div>`,{label:'Leave stage',fn:mcqStages});
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>guard(async()=>{
    document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    const r=await rpc('stage_answer',{p_attempt:S.id,p_qid:q.id,p_choice:b.dataset.k});
    if(r.correct)S.correct++;
    document.querySelectorAll('.opt').forEach(x=>{if(x.dataset.k===r.correct_option)x.classList.add('ok');else if(x===b)x.classList.add('no')});
    $('#ex').innerHTML=`<div class="note">${r.correct?'Correct. ':'Not quite. '}${esc(r.explanation||'')}</div>`;
    $('#nx').disabled=false;
  }));
  $('#nx').onclick=()=>last?finishStage():(S.i++,stageQ());
}
async function finishStage(){
  const S=ctx.stg;loading('Checking your stage…');
  await guard(async()=>{
    const r=await rpc('stage_finish',{p_attempt:S.id});
    shell(`<div class="card" style="text-align:center"><div class="muted">Stage ${r.stage}</div>
      <div class="big" style="color:${r.passed?'var(--good)':'var(--bad)'}">${r.correct}/${r.total}</div>
      <div class="note" style="text-align:left">${r.passed?(r.next_stage?`Stage cleared. Stage ${r.next_stage} is now open.`:'Stage cleared.'):`You need ${r.need} correct to clear this stage. Read it again and retry. The same questions will come back in a different order.`}</div>
      <div class="row" style="margin-bottom:10px">${r.passed&&r.next_stage?`<button class="btn" id="n">Play Stage ${r.next_stage}</button>`:`<button class="btn" id="n">Try again</button>`}<button class="btn alt" id="rv">Read stage</button></div>
      <button class="btn alt" id="m">All stages</button></div>`);
    $('#n').onclick=()=>runStage(r.passed&&r.next_stage?r.next_stage:r.stage);
    $('#rv').onclick=()=>stageReview(r.stage);$('#m').onclick=mcqStages;
  },mcqStages);
}
async function stageReview(stage){
  loading();
  await guard(async()=>{
    const d=await rpc('stage_review',{p_level:ctx.level,p_stage:stage});const L='ABCD';
    shell(`<h2>Stage ${stage}</h2><p class="muted" style="margin:4px 0 12px">The correct answers are marked in green.</p>

/* ============ FLASHCARDS (v2) ============ */
async function flashcards(kind){
  VIEW='fc';loading();
  await guard(async()=>{
    let items=[];
    if(kind==='cq'){
      const lid=levelId(ctx.level);
      const {data,error}=await sb.from('study_materials').select('question,answer').eq('level_id',lid).eq('is_published',true).order('sort_order').limit(500);
      if(!error&&data&&data.length)items=data.map(x=>({front:x.question,back:x.answer}));
    }
    if(!items.length){
      const PS=100;let off=0,total=1;const raw=[];
      while(off<total){
        const d=await rpc('study_history',{p_kind:kind,p_level:ctx.level,p_limit:PS,p_offset:off});
        total=d.total||0;(d.items||[]).forEach(x=>raw.push(x));off+=PS;
        if(!(d.items||[]).length)break;
      }
      const L='ABCD';
      items=raw.map(x=>{
        if(kind==='mcq'){const ci=L.indexOf(x.correct_option);return {front:x.question,back:(ci>=0?L[ci]+'. ':'')+(x.options&&x.options[ci]!=null?x.options[ci]:''),extra:x.explanation||''}}
        if(kind==='cq')return {front:x.question,back:x.answer};
        return {front:'',img:x.image_path,back:x.name};
      });
    }
    ctx.fc={kind,items,i:0,flip:false,know:0,dunno:0,done:{}};
    drawFlash();
  },()=>hub(ctx.level));
}
function drawFlash(){
  const F=ctx.fc,back={label:'Level '+ctx.level,fn:()=>hub(ctx.level)};
  const tabs=['mcq','cq','tool'].map(k=>`<button data-k="${k}" class="${k===F.kind?'on':''}">${LABEL[k]}</button>`).join('');
  if(!F.items.length){
    shell(`<h2>Flashcards</h2><p class="muted" style="margin:4px 0 12px">Level ${ctx.level}</p><div class="tabs">${tabs}</div>
      <div class="card"><b>No cards yet.</b><p class="muted" style="margin:4px 0 0">Study some ${LABEL[F.kind]} first — everything you study becomes a flashcard here.</p></div>`,back);
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>flashcards(b.dataset.k));
    return;
  }
  const it=F.items[F.i],marked=Object.keys(F.done).length;
  const front=it.img?`<div class="toolimg" style="width:100%"><img src="${esc(imgUrl(it.img))}" alt="Tool"></div><div class="fq">What is this tool?</div>`:`<div class="fq">${esc(it.front)}</div>`;
  const backHtml=`<div class="fa">${esc(it.back)}</div>${it.extra?`<div class="note" style="text-align:left;width:100%">${esc(it.extra)}</div>`:''}`;
  shell(`<h2>Flashcards</h2><p class="muted" style="margin:4px 0 12px">Level ${ctx.level} · tap the card to see the answer</p>
    <div class="tabs">${tabs}</div>
    <div class="qhead"><span>Card ${F.i+1} of ${F.items.length}</span><span class="pill">✅ ${F.know} &nbsp; ❌ ${F.dunno}</span></div>
    <div class="fcard ${F.flip?'flip':''}" id="fc"><div class="finner"><div class="fface">${front}<p class="muted" style="margin:12px 0 0;font-size:.85rem">Tap to flip</p></div><div class="fface back">${backHtml}</div></div></div>
    <div class="row" style="margin-bottom:10px"><button class="btn alt" id="fpv" ${F.i===0?'disabled':''}>← Previous</button><button class="btn" id="fsh">🔀 Shuffle</button><button class="btn alt" id="fnx" ${F.i+1>=F.items.length?'disabled':''}>Next →</button></div>
    ${F.flip?`<div class="row"><button class="btn bad" id="fdn">❌ জানি না</button><button class="btn" id="fkn" style="background:var(--good);box-shadow:none">✅ জানি</button></div>`:''}
    ${marked>=F.items.length?`<div class="card" style="margin-top:12px;text-align:center"><b>সব কার্ড শেষ!</b><p class="muted" style="margin:4px 0 10px">জানি: ${F.know} · জানি না: ${F.dunno}</p><button class="btn" id="frs">আবার শুরু করো</button></div>`:''}`,back);
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>flashcards(b.dataset.k));
  $('#fc').onclick=()=>{F.flip=!F.flip;drawFlash()};
  if($('#fpv'))$('#fpv').onclick=e=>{e.stopPropagation();F.i--;F.flip=false;drawFlash()};
  if($('#fnx'))$('#fnx').onclick=e=>{e.stopPropagation();F.i++;F.flip=false;drawFlash()};
  if($('#fsh'))$('#fsh').onclick=e=>{e.stopPropagation();for(let i=F.items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[F.items[i],F.items[j]]=[F.items[j],F.items[i]]}F.i=0;F.flip=false;F.done={};F.know=0;F.dunno=0;drawFlash()};
  const mark=ok=>{if(!(F.i in F.done)){F.done[F.i]=ok;ok?F.know++:F.dunno++}if(F.i+1<F.items.length){F.i++;F.flip=false}drawFlash()};
  if($('#fkn'))$('#fkn').onclick=()=>mark(true);
  if($('#fdn'))$('#fdn').onclick=()=>mark(false);
  if($('#frs'))$('#frs').onclick=()=>flashcards(F.kind);
}

function runExam(){

  let body;
  if(E.kind==='cq'){
    body=`<div class="qtext">${esc(q.question)}</div><textarea id="tx" rows="7" placeholder="Write your answer in full sentences…">${esc(E.answers[q.position]||'')}</textarea><p class="muted" style="margin:6px 0 12px;font-size:.9rem">Marks are given automatically for the key points in your answer. Random or very short text scores 0.</p><button class="btn" id="nx">${last?'Finish exam':'Next'}</button>`;

  }

  timerId=setInterval(()=>{const l=left(),t=$('#tm');if(t){t.textContent=mm(l);if(l<300)t.classList.add('low')}if(l<=0){clearInterval(timerId);submitExam(true)}},1000);
  if(E.kind==='cq'){
    $('#nx').onclick=()=>{E.answers[q.position]=$('#tx').value;E.i++;last?submitExam(false):runExam()};

function parseCSV(text,d){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else{if(ch==='"')q=true;else if(ch===d){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function csvObjects(text){
  text=text.replace(/^\uFEFF/,'');const first=text.split(/\r?\n/)[0]||'';
  const d=first.includes('\t')&&!first.includes(',')?'\t':',';
  const r=parseCSV(text,d);if(!r.length)return[];
  const h=r.shift().map(x=>x.trim().toLowerCase());
  return r.map(c=>Object.fromEntries(h.map((k,i)=>[k,(c[i]||'').trim()])));
}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function chunked(rows,size,fn){let done=0;for(let i=0;i<rows.length;i+=size){await fn(rows.slice(i,i+size));done+=Math.min(size,rows.length-i);const s=$('#imsg');if(s)s.textContent='Uploading… '+done+' / '+rows.length}}

function bulkBox(label,hint,tpl){
  return `<div class="card"><h3>Bulk upload</h3><p class="muted" style="margin:4px 0 10px">${hint}</p>
   <input type="file" id="bf" accept=".csv,.txt,text/csv" style="margin-bottom:8px"><textarea id="bt" rows="4" placeholder="…or paste rows here (copy from Excel / Google Sheets, include the header row)"></textarea>
   <div class="row" style="margin-top:8px"><button class="btn alt sm" id="bd">Download template</button><button class="btn sm" id="bi">Import</button></div><p class="muted" id="imsg" style="margin:8px 0 0"></p></div>`;
}
function bindBulk(tpl,importer){
  $('#bf').onchange=async e=>{const f=e.target.files[0];if(f)$('#bt').value=await f.text()};
  $('#bd').onclick=()=>download('template.csv',tpl);
  $('#bi').onclick=()=>{const txt=$('#bt').value.trim();if(!txt)return toast('Choose a file or paste rows first.');$('#bi').disabled=true;
    importer(csvObjects(txt)).then(m=>{$('#imsg').textContent=m;toast('Import finished')}).catch(e=>{$('#imsg').textContent='Error: '+errMsg(e)}).finally(()=>{$('#bi').disabled=false})};
}
function delBtn(table,id,after,extra){return `<button class="btn bad sm" data-del="${table}|${id}|${extra||''}" style="flex:none">Delete</button>`}
function bindDeletes(after){
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>guard(async()=>{
    if(!confirm('Delete this item? Students who studied it lose it from their history. An MCQ leaves an empty slot in its stage; the slot is not refilled.'))return;
    const [t,id,extra]=b.dataset.del.split('|');
    const {error}=await sb.from(t).delete().eq('id',id);if(error)throw error;
    if(extra)await sb.storage.from('tool-images').remove([extra]);
    toast('Deleted');after();
  }));
}

  $('#slv').onchange=draw;draw();
  const imp=async rows=>{
    const ok=[],bad=[];
    rows.forEach((r,i)=>{const lv=+(r.level||1),c=(r.correct||r.correct_option||'').toUpperCase(),st=r.stage?+r.stage:null;
      const o={level:lv,question_text:r.question||r.question_text,option_a:r.option_a||r.a,option_b:r.option_b||r.b,option_c:r.option_c||r.c,option_d:r.option_d||r.d,correct_option:c,explanation:r.explanation||'',stage:st};
      if(!o.question_text||!o.option_a||!o.option_b||!o.option_c||!o.option_d||!'ABCD'.includes(c)||c.length!==1||!levelId(lv)||(st!==null&&(st<1||st>100)))bad.push(i+2);else ok.push(o)});
    let ins=0,skip=0,fail=0,last='';
    for(let i=0;i<ok.length;i+=100){const r=await rpc('admin_import_mcq_staged',{p_rows:ok.slice(i,i+100)});ins+=r.inserted;skip+=r.skipped;fail+=r.failed;if(r.last_error)last=r.last_error;const m=$('#imsg');if(m)m.textContent='Uploading… '+Math.min(i+100,ok.length)+' / '+ok.length}
    return `Imported ${ins}, skipped ${skip} duplicate(s)${fail?`, ${fail} failed (${last})`:''}${bad.length?`, ${bad.length} invalid row(s) (rows ${bad.slice(0,10).join(', ')}${bad.length>10?'…':''})`:''}. Open the MCQ tab again to see the list.`;
  };
  bindBulk('level,question,option_a,option_b,option_c,option_d,correct,explanation,stage\n1,"Which gas shields a MIG weld?",Hydrogen,"Argon + CO2",Nitrogen,Helium,B,"Argon/CO2 mix gives a stable arc.",\n',imp);

    if(!row.question_text||!row.option_a||!row.option_b||!row.option_c||!row.option_d)return toast('Fill the question and all four options.');
    const r=await rpc('admin_import_mcq_staged',{p_rows:[row]});
    if(r.failed)return toast(r.last_error||'Could not save');
    toast(r.inserted?'MCQ saved':'Skipped: this question already exists');if(r.inserted)admin('mcq');
  });
  // Browse, filter & edit MCQs
  let editId=null,debT=null;
  $('#fst').innerHTML='<option value="">All stages</option>'+Array.from({length:100},(_,i)=>`<option value="${i+1}">Stage ${i+1}</option>`).join('');
  const openEdit=id=>{
    const x=(ctx.qrows||[]).find(r=>String(r.id)===String(id));if(!x)return;
    editId=x.id;
    $('#epos').textContent=`L${x.levels?x.levels.level_number:'?'} · Stage ${x.stage_no||'–'} #${x.stage_pos||'–'} — this position never changes`;
    $('#eq').value=x.question_text||'';$('#eqa').value=x.option_a||'';$('#eqb').value=x.option_b||'';$('#eqc').value=x.option_c||'';$('#eqd').value=x.option_d||'';
    $('#ecor').value=x.correct_option||'A';$('#eex').value=x.explanation||'';
    $('#ecard').style.display='';$('#ecard').scrollIntoView({behavior:'smooth',block:'start'});
  };
  const drawQ=async()=>{
    try{
      let q=sb.from('questions_mcq').select('id,question_text,option_a,option_b,option_c,option_d,correct_option,explanation,stage_no,stage_pos,levels(level_number)',{count:'exact'}).order('stage_no',{ascending:true}).order('stage_pos',{ascending:true}).limit(300);
      const lv=$('#flv').value,st=$('#fst').value,txt=$('#fq').value.trim();
      if(lv)q=q.eq('level_id',levelId(+lv));
      if(st)q=q.eq('stage_no',+st);
      if(txt)q=q.ilike('question_text','%'+txt.replace(/[%_]/g,'')+'%');
      const {data:rows,count:fc,error}=await q;if(error)throw error;
      ctx.qrows=rows||[];
      $('#fcount').textContent=`Showing ${ctx.qrows.length} of ${fc==null?ctx.qrows.length:fc} matching MCQs${ctx.qrows.length>=300?' (first 300 — narrow the filter to see the rest)':''}.`;
      $('#qlist').innerHTML=ctx.qrows.length?ctx.qrows.map(x=>`<div class="item"><div class="tx"><b>L${x.levels?x.levels.level_number:'?'} · Stage ${x.stage_no||'–'} #${x.stage_pos||'–'}</b> ${esc(x.question_text)} <span class="pill">${x.correct_option}</span></div><button class="btn alt sm" data-edit="${x.id}" style="flex:none">Edit</button>${delBtn('questions_mcq',x.id)}</div>`).join(''):'<p class="muted" style="margin:0">No MCQs match this filter yet.</p>';
      document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));

    toast('MCQ updated');$('#ecard').style.display='none';editId=null;drawQ();
  });
  drawQ();
}

function parseKw(s){return (s||'').split(';').map(g=>g.split('|').map(w=>w.trim().toLowerCase()).filter(Boolean)).filter(g=>g.length)}
async function adminCQ(){
  const {data,count}=await sb.from('questions_cq').select('id,question_text,keywords,levels(level_number)',{count:'exact'}).order('created_at',{ascending:false}).limit(30);
  return `<div class="card"><h3>Add one CQ</h3>
   <label class="field" style="margin-top:10px"><span>Level</span><select id="clv">${lvlOptions(1)}</select></label>
   <label class="field"><span>Question</span><textarea id="cqq" rows="2"></textarea></label>
   <label class="field"><span>Model answer</span><textarea id="cqa" rows="4"></textarea></label>
   <label class="field"><span>Key points for automatic marking (optional)</span><input id="ckw" placeholder="cool|cooling ; crack ; hydrogen ; stress"></label>
   <p class="muted" style="margin:-4px 0 10px;font-size:.88rem">Separate key points with ;  and alternative words with |  . A student gets full marks when enough key points appear (3 by default). Leave empty and marks are given by how many important words of the model answer appear.</p>
   <label class="field"><span>Key points needed for full marks</span><input id="cnd" type="number" min="1" max="10" value="3"></label><button class="btn" id="csv">Save CQ</button></div>
   ${bulkBox('CQ','Columns: level, question, answer, keywords (optional, same format as above), need (optional).')}
   <div class="sec"><h3>Latest CQs</h3><span class="muted">${count||0} total</span></div>
   ${(data||[]).map(x=>`<div class="item"><div class="tx"><b>L${x.levels?x.levels.level_number:'?'}</b> ${esc(x.question_text)} ${x.keywords&&x.keywords.length?'<span class="pill">auto-marking</span>':''}</div>${delBtn('questions_cq',x.id)}</div>`).join('')}`;
}
function bindCQ(){
  const mk=r=>{const lv=+(r.level||1),kw=parseKw(r.keywords),need=Math.max(1,Math.min(+(r.need||3)||3,kw.length||3));
    return {level_id:levelId(lv),question_text:(r.question||'').trim(),model_answer:(r.answer||r.model_answer||'').trim(),keywords:kw,need_keywords:need}};
  const imp=async rows=>{
    const ok=rows.map(mk).filter(o=>o.level_id&&o.question_text&&o.model_answer);
    await chunked(ok,200,async ch=>{const {error}=await sb.from('questions_cq').insert(ch);if(error)throw error});
    return `Imported ${ok.length}, skipped ${rows.length-ok.length} invalid row(s). Do not import the same file twice.`;
  };
  bindBulk('level,question,answer,keywords,need\n1,"Why preheat thick steel?","Preheating slows cooling and reduces cracking, hydrogen and residual stress.","cool|cooling;crack;hydrogen;stress",3\n',imp);
  $('#csv').onclick=()=>guard(async()=>{
    const o=mk({level:$('#clv').value,question:$('#cqq').value,answer:$('#cqa').value,keywords:$('#ckw').value,need:$('#cnd').value});
    if(!o.question_text||!o.model_answer)return toast('Fill the question and the model answer.');
    const {error}=await sb.from('questions_cq').insert(o);if(error)throw error;toast('CQ saved');admin('cq');
  });
  bindDeletes(()=>admin('cq'));
}

/* ---- Tools ---- */
function resizeImage(file,max){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej(new Error('Image conversion failed'))},'image/jpeg',.85)};
  img.onerror=()=>rej(new Error('That file is not an image'));img.src=u})}
async function adminTools(){

async function nextSort(lid){const {data}=await sb.from('study_materials').select('sort_order').eq('level_id',lid).order('sort_order',{ascending:false}).limit(1);return data&&data[0]?data[0].sort_order+1:1}
function bindAllCQ(){
  const imp=async rows=>{
    const byLevel={};let bad=0;
    rows.forEach(r=>{const lv=+(r.level||1),lid=levelId(lv),q=(r.question||'').trim(),a=(r.answer||'').trim();if(!lid||!q||!a){bad++;return}(byLevel[lid]=byLevel[lid]||[]).push({level_id:lid,question:q,answer:a})});
    let n=0;
    for(const lid of Object.keys(byLevel)){let s=await nextSort(lid);const list=byLevel[lid].map(x=>({...x,sort_order:s++}));
      await chunked(list,300,async ch=>{const {error}=await sb.from('study_materials').insert(ch);if(error)throw error});n+=list.length}
    return `Imported ${n}${bad?`, skipped ${bad} invalid row(s)`:''}. Do not import the same file twice.`;
  };
  bindBulk('level,question,answer\n1,"What does MIG stand for?","Metal Inert Gas welding."\n',imp);
  $('#asv').onclick=()=>guard(async()=>{
    const lid=levelId(+$('#alv').value),q=$('#aq').value.trim(),a=$('#aa').value.trim();
    if(!q||!a)return toast('Fill the question and the answer.');
    const {error}=await sb.from('study_materials').insert({level_id:lid,question:q,answer:a,sort_order:await nextSort(lid)});if(error)throw error;toast('Saved');admin('allcq');
  });
  bindDeletes(()=>admin('allcq'));
}


/* ============ TEACHER REPORT (v2) ============ */
async function adminReport(){
  const rows=await rpc('admin_students');ctx.students=rows;
  const sorted=[...rows].sort((a,b)=>b.points-a.points);
  const totalPts=rows.reduce((a,r)=>a+r.points,0);
  const avg=rows.length?Math.round(totalPts/rows.length):0;
  const started=rows.filter(r=>r.studied>0).length;
  const cleared=rows.filter(r=>r.levels_cleared>0).length;
  const exams=rows.reduce((a,r)=>a+r.exams_taken,0);
  const weekAgo=Date.now()-7*24*3600*1000;
  const behind=rows.filter(r=>r.studied===0||!r.last_active||new Date(r.last_active).getTime()<weekAgo);
  const wa=r=>{const d=String(r.phone||'').replace(/\D/g,'');return d?` <a href="https://wa.me/${d.startsWith('88')?d:'88'+d}" target="_blank" rel="noopener">WhatsApp</a>`:''};
  return `<div class="stats"><div class="stat"><b>${rows.length}</b><span>Students</span></div><div class="stat"><b>${avg}</b><span>Average points</span></div><div class="stat"><b>${started}</b><span>Started studying</span></div><div class="stat"><b>${cleared}</b><span>Cleared a level</span></div></div>
   <div class="stats"><div class="stat"><b>${exams}</b><span>Exams taken</span></div><div class="stat"><b>${totalPts}</b><span>Total points</span></div><div class="stat"><b>${behind.length}</b><span>পেছিয়ে আছে</span></div><div class="stat"><b>${sorted[0]?esc(sorted[0].full_name||'–'):'–'}</b><span>Top student</span></div></div>
   <div class="row" style="margin-bottom:10px"><button class="btn alt sm" id="rex" style="flex:none">Export report CSV</button></div>
   <div class="sec"><h3>🏆 সেরা ১০ ছাত্র</h3></div>
   <div class="scroll"><table><thead><tr><th>#</th><th>Name</th><th>Points</th><th>Levels cleared</th><th>Studied</th><th>Exams</th></tr></thead><tbody>
   ${sorted.slice(0,10).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.full_name||'–')}</td><td><b>${r.points}</b></td><td>${r.levels_cleared}</td><td>${r.studied}</td><td>${r.exams_taken}</td></tr>`).join('')||'<tr><td colspan="6">No students yet.</td></tr>'}
   </tbody></table></div>
   <div class="sec"><h3>⚠️ পেছিয়ে থাকা ছাত্র (${behind.length})</h3></div>
   <p class="muted" style="margin:0 0 10px">যারা এখনো পড়া শুরু করেনি, অথবা ৭ দিনের বেশি সময় ধরে আসেনি। ফোন/WhatsApp করে খবর নিন।</p>
   <div class="scroll"><table><thead><tr><th>Name</th><th>Phone</th><th>Points</th><th>Studied</th><th>Last active</th></tr></thead><tbody>
   ${behind.map(r=>`<tr><td>${esc(r.full_name||'–')}</td><td>${esc(r.phone||'–')}${wa(r)}</td><td>${r.points}</td><td>${r.studied}</td><td>${r.last_active?new Date(r.last_active).toLocaleDateString():'কখনো আসেনি'}</td></tr>`).join('')||'<tr><td colspan="5">কেউ পেছিয়ে নেই — সবাই সক্রিয়! 🎉</td></tr>'}
   </tbody></table></div>
   <p class="muted" style="margin-top:12px;font-size:.88rem">পরের ধাপে চাইলে: কোন প্রশ্নে ছাত্ররা সবচেয়ে বেশি ভুল করে — সেই হিসাবও এই রিপোর্টে যোগ করা যাবে।</p>`;
}
function bindReport(){
  const b=$('#rex');if(!b)return;
  b.onclick=()=>download('teacher-report.csv',['name,email,phone,points,levels_cleared,studied,exams_taken,last_active'].concat(ctx.students.map(r=>[r.full_name,r.email,r.phone,r.points,r.levels_cleared,r.studied,r.exams_taken,r.last_active||''].map(csvCell).join(','))).join('\n'));
}

/* ============ JOIN CODES (v2, needs the SQL setup file) ============ */
async function adminJoin(){
  let listHtml='';
  try{
    const rows=await rpc('admin_join_codes');
    listHtml=rows&&rows.length?`<div class="scroll"><table><thead><tr><th>Code</th><th>Class / batch</th><th>Level</th><th>Joined</th><th>Created</th><th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td><b>${esc(r.code)}</b></td><td>${esc(r.label||'')}</td><td>${r.level_number}</td><td>${r.joined_count}</td><td>${new Date(r.created_at).toLocaleDateString()}</td><td><button class="btn alt sm" data-jv="${esc(r.code)}">Students</button></td></tr>`).join('')}
      </tbody></table></div><div id="jstu" style="margin-top:10px"></div>`:`<div class="card"><b>No codes yet.</b><p class="muted" style="margin:4px 0 0">Make your first code above.</p></div>`;
  }catch(e){
    listHtml=`<div class="card"><b>⚠️ একটা ছোট সেটআপ বাকি আছে</b><p class="muted" style="margin:4px 0 0">Join code চালু করতে Supabase-এ একবার <b>Weld_Path_Join_Codes.sql</b> ফাইলটা চালাতে হবে (SQL Editor-এ পেস্ট করে Run)। ফাইলটা Ashik-এর কাছে পাঠানো হয়েছে। চালানো হয়ে গেলে এই পেজটা আবার খুলুন।</p></div>`;
  }
  return `<div class="card"><h3>নতুন ক্লাস কোড বানান</h3>
   <label class="field" style="margin-top:10px"><span>Level</span><select id="jlv">${lvlOptions(1)}</select></label>
   <label class="field"><span>Class / batch name</span><input id="jlb" placeholder="e.g. Batch 2026 – Morning"></label>
   <button class="btn" id="jmk">Make code</button><div id="jnew" style="margin-top:12px"></div></div>
   <div class="sec"><h3>সব কোড</h3></div>${listHtml}`;
}
function bindJoin(){
  document.querySelectorAll('[data-jv]').forEach(b=>b.onclick=()=>guard(async()=>{
    const rows=await rpc('admin_code_students',{p_code:b.dataset.jv});
    $('#jstu').innerHTML=`<div class="card"><h3>${esc(b.dataset.jv)} — ${rows.length} জন ছাত্র</h3>${rows.length?rows.map(r=>`<div class="item"><div class="tx"><b>${esc(r.full_name||'–')}</b> · ${esc(r.phone||'')}</div><span class="muted">${new Date(r.joined_at).toLocaleDateString()}</span></div>`).join(''):'<p class="muted" style="margin:6px 0 0">এই কোড দিয়ে এখনো কেউ যোগ দেয়নি।</p>'}</div>`;
  }));
  const mk=$('#jmk');if(!mk)return;
  mk.onclick=()=>guard(async()=>{
    mk.disabled=true;
    try{
      const code=await rpc('create_join_code',{p_level:+$('#jlv').value,p_label:$('#jlb').value.trim()});
      $('#jnew').innerHTML=`<p class="muted" style="margin:0 0 6px">এই কোডটা ছাত্রদের দিন — ওরা Dashboard থেকে যোগ দেবে:</p><div class="bigcode">${esc(code)}</div>`;
    }catch(e){toast('আগে SQL সেটআপ ফাইলটা চালাতে হবে');}
    mk.disabled=false;
  });
}

/* ============ AI MCQ MAKER (v2) ============ */
function geminiKey(){try{return localStorage.getItem('wp_gkey')||''}catch(e){return ''}}
async function adminAI(){
  const has=!!geminiKey();
  return `<div class="card"><h3>🤖 AI দিয়ে MCQ বানান</h3>
   <p class="muted" style="margin:4px 0 10px">টপিক লিখে দিলে AI নিজে প্রশ্ন, ৪টা অপশন আর সঠিক উত্তর বানিয়ে দেবে। পছন্দ হলে এক ক্লিকে সেভ — প্রশ্নগুলো ছাত্রদের stage-এ চলে যাবে।</p>
   <label class="field"><span>Your free Gemini key ${has?'✅ saved in this browser':''}</span><input id="gk" type="password" placeholder="${has?'•••••••••• (saved)':'Paste your Gemini key'}" value=""></label>
   <div class="row" style="margin-bottom:12px"><button class="btn alt sm" id="gks" style="flex:none">Save key</button><span class="muted" style="font-size:.85rem">Free key: aistudio.google.com/apikey — key শুধু আপনার এই ব্রাউজারেই থাকে, সার্ভারে যায় না।</span></div>
   <label class="field"><span>Topic</span><input id="atp" placeholder="e.g. MIG welding safety and PPE"></label>
   <label class="field"><span>Notes (optional — paste text, AI will make questions from it)</span><textarea id="ant" rows="4"></textarea></label>
   <div class="grid2"><label class="field"><span>Level</span><select id="alv2">${lvlOptions(1)}</select></label>
   <label class="field"><span>How many?</span><select id="acn"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label></div>
   <label class="field"><span>Language</span><select id="alg"><option value="English">English</option><option value="Bengali (Bangla)">বাংলা</option></select></label>
   <button class="btn" id="agn">✨ প্রশ্ন বানাও</button><p class="muted" id="amsg" style="margin:8px 0 0"></p></div>
   <div id="aprev"></div>`;
}
function bindAI(){
  $('#gks').onclick=()=>{const v=$('#gk').value.trim();try{v?localStorage.setItem('wp_gkey',v):localStorage.removeItem('wp_gkey')}catch(e){} toast(v?'Key saved in this browser':'Key removed');admin('ai')};
  $('#agn').onclick=()=>guard(async()=>{
    const key=geminiKey()||$('#gk').value.trim();
    const topic=$('#atp').value.trim(),notes=$('#ant').value.trim(),n=+$('#acn').value,lang=$('#alg').value,msg=$('#amsg');
    if(!key){msg.textContent='আগে Gemini key বসান (ফ্রি) — aistudio.google.com/apikey';return}
    if(!topic&&!notes){msg.textContent='Topic লিখুন, অথবা Notes-এ লেখা পেস্ট করুন।';return}
    $('#agn').disabled=true;msg.textContent='AI প্রশ্ন বানাচ্ছে… একটু অপেক্ষা করুন।';
    try{
      const prompt='Make exactly '+n+' multiple-choice questions for welding students, in '+lang+'. '+(topic?('Topic: '+topic+'. '):'')+(notes?('Base the questions only on these notes:\n'+notes+'\n'):'')+'Return ONLY a JSON array. Each item: {"question":"...","option_a":"...","option_b":"...","option_c":"...","option_d":"...","correct":"A","explanation":"one short line"}. correct must be one of A, B, C, D. Vary which option is correct. No markdown, no text outside the JSON array.';
      const models=['gemini-2.5-flash','gemini-2.0-flash'];let data=null,lastErr=null;
      for(const m of models){
        try{
          const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json',['X-Goog-'+'Api-Key']:key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:.7}})});
          if(!r.ok)throw new Error('AI answered '+r.status);
          data=await r.json();break;
        }catch(e){lastErr=e}
      }
      if(!data)throw lastErr||new Error('AI did not answer');
      let txt=(((data.candidates||[])[0]||{}).content||{}).parts?.map(p=>p.text||'').join('')||'';
      txt=txt.replace(/```json|```/g,'').trim();
      const arr=JSON.parse(txt);
      if(!Array.isArray(arr)||!arr.length)throw new Error('AI gave no questions');
      ctx.aiRows=arr.map(q=>({level:+$('#alv2').value,question_text:String(q.question||'').trim(),option_a:String(q.option_a||'').trim(),option_b:String(q.option_b||'').trim(),option_c:String(q.option_c||'').trim(),option_d:String(q.option_d||'').trim(),correct_option:String(q.correct||'A').toUpperCase().slice(0,1),explanation:String(q.explanation||'').trim(),stage:null})).filter(q=>q.question_text&&q.option_a&&q.option_b&&q.option_c&&q.option_d&&'ABCD'.includes(q.correct_option));
      if(!ctx.aiRows.length)throw new Error('AI questions were incomplete');
      msg.textContent=ctx.aiRows.length+'টা প্রশ্ন তৈরি। নিচে দেখে পছন্দগুলো টিক দিয়ে সেভ করুন।';
      $('#aprev').innerHTML=`<div class="sec"><h3>তৈরি প্রশ্ন (${ctx.aiRows.length})</h3></div>`+ctx.aiRows.map((q,i)=>`<div class="item"><input type="checkbox" class="aick" data-i="${i}" checked style="width:auto;flex:none;margin-top:4px"><div class="tx"><b>${i+1}.</b> ${esc(q.question_text)}<div class="muted" style="font-size:.88rem">A. ${esc(q.option_a)} · B. ${esc(q.option_b)} · C. ${esc(q.option_c)} · D. ${esc(q.option_d)} · <b style="color:var(--good)">সঠিক: ${q.correct_option}</b></div></div></div>`).join('')+`<button class="btn" id="asave" style="margin-top:10px">✔ টিক দেওয়া প্রশ্নগুলো সেভ করো</button><p class="muted" id="asmsg" style="margin:8px 0 0"></p>`;
      $('#asave').onclick=()=>guard(async()=>{
        const sel=[...document.querySelectorAll('.aick')].filter(c=>c.checked).map(c=>ctx.aiRows[+c.dataset.i]);
        if(!sel.length){$('#asmsg').textContent='একটাও টিক দেননি।';return}
        $('#asave').disabled=true;let ins=0,skip=0,fail=0,last='';
        for(let i=0;i<sel.length;i+=100){const r=await rpc('admin_import_mcq_staged',{p_rows:sel.slice(i,i+100)});ins+=r.inserted;skip+=r.skipped;fail+=r.failed;if(r.last_error)last=r.last_error}
        $('#asmsg').textContent='সেভ হয়েছে '+ins+'টা'+(skip?', আগেই ছিল '+skip+'টা বাদ':'')+(fail?', '+fail+'টা হয়নি ('+last+')':'')+'. MCQ ট্যাবে দেখতে পাবেন।';
        $('#asave').disabled=false;
      });
    }catch(e){msg.textContent='হয়নি: '+errMsg(e)+' — key ঠিক আছে কিনা দেখুন, আবার চেষ্টা করুন।'}
    $('#agn').disabled=false;
  });
}

boot();
</script>
